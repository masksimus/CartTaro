name: CartTaro V5 - Release Candidate PostgreSQL Android QA
on:
  push:
    branches:
      - feature/tarot-v5-release-candidate
    paths:
      - 'release/**'
      - 'server/src/**'
      - 'tests/v5-release.spec.mjs'
      - 'tests/v5-public-preview.spec.mjs'
      - '.github/workflows/tarot-v5-release-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-candidate:
    name: Real PostgreSQL, signed VK, idempotent rewards and Android QA
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: carttaro_ci
          POSTGRES_USER: tarot_ci
          POSTGRES_PASSWORD: fixture_for_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarot_ci -d carttaro_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGTEST_URL: postgresql://tarot_ci:fixture_for_ci_only@127.0.0.1:5432/carttaro_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install database driver
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Validate server and release-client syntax
        run: |
          node --check server/src/api-v2-handler.mjs
          node --check server/src/pg-store.mjs
          node --check release/app.js
          node --check server/test/pg-http-fixture.mjs
          node --check tests/v5-release.spec.mjs
          node --check tests/v5-public-preview.spec.mjs
      - name: Run existing server/PostgreSQL regression tests
        run: node --test --test-reporter=spec server/test/*.test.mjs
      - name: Install Playwright and Chromium
        working-directory: tests
        run: |
          npm install --ignore-scripts --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Run signed public-game fixture with real PostgreSQL
        env:
          DATABASE_URL: postgresql://tarot_ci:fixture_for_ci_only@127.0.0.1:5432/carttaro_ci
          VK_PROTECTED_KEY: TARO_E2E_FIXTURE_ONLY_NEVER_PRODUCTION
          TARO_V2_PUBLIC_GAME_ENABLED: 'true'
          TARO_V2_WRITES_ENABLED: 'true'
          NODE_ENV: test
          HOST: 127.0.0.1
          PORT: '8788'
        run: |
          set -eu
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/taro-static.log 2>&1 &
          node server/test/pg-http-fixture.mjs > /tmp/taro-api.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8765/release/index.html >/dev/null && curl -fsS http://127.0.0.1:8788/api/v2/status >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/taro-static.log
          cat /tmp/taro-api.log
          exit 1
      - name: Verify release candidate on 320, 360 and 393 pixel Android screens
        working-directory: tests
        run: npx playwright test --config playwright.config.mjs v5-release.spec.mjs
      - name: Verify deployed V5 preview against real CDN and fail-closed API
        working-directory: tests
        run: npx playwright test --config playwright.config.mjs v5-public-preview.spec.mjs
      - name: Upload diagnostic traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carttaro-v5-rc-qa
          retention-days: 7
          if-no-files-found: warn
          path: |
            tests/report/
            tests/test-results/
