name: CartTaro original art gallery QA
on:
  push:
    branches:
      - feature/tarot-arcana-art-preview
    paths:
      - 'art-preview/**'
      - '.github/workflows/carttaro-art-gallery-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install mobile browser test dependency
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start loopback static server
        run: |
          mkdir -p /tmp/CartTaro
          ln -s "$GITHUB_WORKSPACE/art-preview" /tmp/CartTaro/art-preview
          python3 -m http.server 8776 --directory /tmp --bind 127.0.0.1 >/tmp/art-preview-http.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8776/CartTaro/art-preview/ >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/art-preview-http.log
          exit 1
      - name: Test 22 original SVGs and 1/3-card experience at 4 screen widths
        run: node art-preview/tests/browser.mjs
      - name: Save viewport screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carttaro-art-preview-qa
          if-no-files-found: warn
          retention-days: 7
          path: art-preview-*.png
