name: CartTaro RWS original paintings — VK game regression

on:
  push:
    branches:
      - feature/tarot-rws-vk-release
    paths:
      - 'index.html'
      - 'tests/vk-original-cards.mjs'
      - '.github/workflows/tarot-rws-vk-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full local historical card assets and proposed game file
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify all 22 historic card files match approved immutable manifest
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          data=json.loads(Path('art-preview/classic/manifest.json').read_text())
          assert len(data)==22
          for i,item in enumerate(data):
              assert item['number']==i
              path=Path('art-preview/classic')/item['file']
              b=path.read_bytes()
              assert b.startswith(bytes.fromhex('ffd8ff')) and b.endswith(bytes.fromhex('ffd9'))
              assert len(b)==item['bytes']
              assert hashlib.sha256(b).hexdigest()==item['sha256']
          print('PASS: all 22 public-domain scans match original approved byte fingerprints')
          PY
      - name: Install headless Android-browser test dependencies
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local mirror of GitHub Pages
        run: |
          set -eu
          mkdir -p /tmp/CartTaro-test
          ln -s "$GITHUB_WORKSPACE" /tmp/CartTaro-test/CartTaro
          python3 -m http.server 8779 --bind 127.0.0.1 --directory /tmp/CartTaro-test > /tmp/tarot-rws-web.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8779/CartTaro/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/tarot-rws-web.log
          exit 1
      - name: Test saved data, first daily draw, real paintings and three-card spreads at three mobile widths
        run: node tests/vk-original-cards.mjs
      - name: Save Android review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carttaro-original-cards-vk-qa
          path: rws-vk-*.png
          retention-days: 7
          if-no-files-found: warn
