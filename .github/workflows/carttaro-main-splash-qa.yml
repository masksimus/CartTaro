name: CartTaro legacy main splash QA

on:
  push:
    branches:
      - fix/carttaro-main-splash-20261104
  workflow_dispatch:
permissions:
  contents: read
jobs:
  splash:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Extract and syntax-check inline script
        run: node tools/qa-main-splash.mjs syntax
      - name: Install browser automation for Android viewport
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise browser launch both without VK and with slow VK Bridge
        run: node tools/qa-main-splash.mjs browser
