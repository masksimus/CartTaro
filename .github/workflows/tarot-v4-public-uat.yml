name: CartTaro V4 - Public UAT Android smoke
on:
  workflow_dispatch:
  push:
    branches:
      - deploy/tarot-v4-uat-20261105
    paths:
      - 'tests/public-vk-uat.spec.mjs'
      - '.github/workflows/tarot-v4-public-uat.yml'
      - 'preview/v2-pilot.*'
      - 'api/v2/**'
      - 'server/src/**'
permissions:
  contents: read
jobs:
  public-uat:
    name: Real Vercel, historical cards and VK safety on Android
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned Chromium browser QA dependencies
        working-directory: tests
        run: |
          npm install --ignore-scripts --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Check the published UAT on three Android viewports
        working-directory: tests
        run: npx playwright test --config playwright.config.mjs public-vk-uat.spec.mjs
      - name: Save diagnostic traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carttaro-public-uat-smoke
          retention-days: 7
          if-no-files-found: warn
          path: |
            tests/report/
            tests/test-results/
